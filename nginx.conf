##############################################################################
# Leaf & Kernel — Nginx VPS Configuration
# File: /etc/nginx/sites-available/leafandkernel.com
#
# Instructions:
#   1. Copy this file to /etc/nginx/sites-available/leafandkernel.com
#   2. ln -s /etc/nginx/sites-available/leafandkernel.com /etc/nginx/sites-enabled/
#   3. sudo nginx -t
#   4. sudo systemctl reload nginx
#   5. Run certbot to add SSL: sudo certbot --nginx -d leafandkernel.com -d www.leafandkernel.com
##############################################################################

server {
    listen 80;
    server_name leafandkernel.com www.leafandkernel.com;

    # Redirect HTTP → HTTPS (certbot will modify this block after SSL setup)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name leafandkernel.com www.leafandkernel.com;

    # SSL — certbot will populate these paths automatically
    ssl_certificate /etc/letsencrypt/live/leafandkernel.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leafandkernel.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/leaf-kernel/dist;
    index index.html;

    # ─── Ensure index.html is revalidated so new releases load immediately ─
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ─── SPA Fallback — CRITICAL for React Router ───────────────────────────
    # Without this, any direct URL access or page refresh returns 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Cache static assets (Vite hashes filenames — safe to cache forever) ─
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
    }

    # ─── Cache public files ──────────────────────────────────────────────────
    location ~* \.(ico|svg|png|webp|jpg|jpeg|gif|woff2|woff)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    # ─── Cache sitemap/robots with short TTL ────────────────────────────────
    location ~* \.(xml|txt)$ {
        expires 1d;
    }

    # ─── Gzip compression ────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1000;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ─── Security headers ─────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ─── Block access to hidden files (e.g. .env) ────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ─── Block favicon.ico 404 log spam ──────────────────────────────────────
    location = /favicon.ico {
        log_not_found off;
        access_log off;
    }
}
